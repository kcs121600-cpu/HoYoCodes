name: Publish signed APK (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact app versionName, e.g. 1.2.0 (no v prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check version and signing secrets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          HOYO_KEYSTORE_B64: ${{ secrets.HOYO_KEYSTORE_B64 }}
          HOYO_KEYSTORE_PASSWORD: ${{ secrets.HOYO_KEYSTORE_PASSWORD }}
          HOYO_KEY_ALIAS: ${{ secrets.HOYO_KEY_ALIAS }}
          HOYO_KEY_PASSWORD: ${{ secrets.HOYO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          grep -Fq "versionName '$RELEASE_VERSION'" app/build.gradle
          test -n "$HOYO_KEYSTORE_B64"
          test -n "$HOYO_KEYSTORE_PASSWORD"
          test -n "$HOYO_KEY_ALIAS"
          test -n "$HOYO_KEY_PASSWORD"
          printf '%s' "$HOYO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hoyo-release.jks"
          test -s "$RUNNER_TEMP/hoyo-release.jks"
      - name: Build signed APK
        env:
          HOYO_KEYSTORE_PATH: ${{ runner.temp }}/hoyo-release.jks
          HOYO_KEYSTORE_PASSWORD: ${{ secrets.HOYO_KEYSTORE_PASSWORD }}
          HOYO_KEY_ALIAS: ${{ secrets.HOYO_KEY_ALIAS }}
          HOYO_KEY_PASSWORD: ${{ secrets.HOYO_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk HoYoCodes-release.apk
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" HoYoCodes-release.apk \
            --title "HoYo Codes v$RELEASE_VERSION" --generate-notes
