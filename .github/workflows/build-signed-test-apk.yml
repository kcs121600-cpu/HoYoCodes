name: Build signed APK test artifact

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v1.2.3-device-test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check version and existing signing secrets
        env:
          HOYO_KEYSTORE_B64: ${{ secrets.HOYO_KEYSTORE_B64 }}
          HOYO_KEYSTORE_PASSWORD: ${{ secrets.HOYO_KEYSTORE_PASSWORD }}
          HOYO_KEY_ALIAS: ${{ secrets.HOYO_KEY_ALIAS }}
          HOYO_KEY_PASSWORD: ${{ secrets.HOYO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'com.privatecodes.hoyo'" app/build.gradle
          grep -Fq 'versionCode 6' app/build.gradle
          grep -Fq "versionName '1.2.3'" app/build.gradle
          test -n "$HOYO_KEYSTORE_B64"
          test -n "$HOYO_KEYSTORE_PASSWORD"
          test -n "$HOYO_KEY_ALIAS"
          test -n "$HOYO_KEY_PASSWORD"
          printf '%s' "$HOYO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hoyo-release.jks"
          test -s "$RUNNER_TEMP/hoyo-release.jks"
      - name: Build signed APK for device testing
        env:
          HOYO_KEYSTORE_PATH: ${{ runner.temp }}/hoyo-release.jks
          HOYO_KEYSTORE_PASSWORD: ${{ secrets.HOYO_KEYSTORE_PASSWORD }}
          HOYO_KEY_ALIAS: ${{ secrets.HOYO_KEY_ALIAS }}
          HOYO_KEY_PASSWORD: ${{ secrets.HOYO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" HoYoCodes-v1.2.3-device-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HoYoCodes-v1.2.3-signed-device-test
          path: HoYoCodes-v1.2.3-device-test.apk
          if-no-files-found: error
          retention-days: 14
