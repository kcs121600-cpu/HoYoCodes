plugins {
    id 'com.android.application'
}

android {
    namespace 'com.privatecodes.hoyo'
    compileSdk 35
    defaultConfig {
        applicationId 'com.privatecodes.hoyo'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (System.getenv('HOYO_KEYSTORE_PATH')) {
                storeFile file(System.getenv('HOYO_KEYSTORE_PATH'))
                storePassword System.getenv('HOYO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HOYO_KEY_ALIAS')
                keyPassword System.getenv('HOYO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('HOYO_KEYSTORE_PATH') && System.getenv('HOYO_KEYSTORE_PASSWORD')
                    && System.getenv('HOYO_KEY_ALIAS') && System.getenv('HOYO_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
